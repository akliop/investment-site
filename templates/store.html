{% extends "base.html" %}

{% block content %}
<div class="row pt-4 justify-content-center">
    <div class="col-lg-10">
        <div class="glass-card border-warning border-opacity-25 shadow-lg p-5 text-center">
            <h2 class="cyber-font text-white mb-3"><i class="fa-solid fa-shop text-warning me-2"></i> متجر المنصة (Cyber Store)</h2>
            <p class="text-dim mb-5">استخدم أرباحك من التعدين (USDT) لشراء خدمات حقيقية!</p>

            <div class="row g-4 justify-content-center">
                <!-- Algeria Recharge Card -->
                <div class="col-md-4">
                    <a href="/portal/store/recharge" class="text-decoration-none">
                        <div class="p-4 bg-dark bg-opacity-25 rounded border border-warning border-opacity-25 hover-scale transition-fast h-100">
                           <i class="fa-solid fa-mobile-screen-button text-warning h1 mb-4"></i>
                           <h4 class="text-white cyber-font small">تعبئة الرصيد 🇩🇿</h4>
                           <div class="badge bg-warning text-black mt-2">فليكسي</div>
                        </div>
                    </a>
                </div>

                <!-- Virtual Cards Card -->
                <div class="col-md-4">
                    <a href="/portal/store/cards" class="text-decoration-none">
                        <div class="p-4 bg-dark bg-opacity-25 rounded border border-info border-opacity-25 hover-scale transition-fast h-100">
                           <i class="fa-solid fa-credit-card text-info h1 mb-4"></i>
                           <h4 class="text-white cyber-font small">البطاقات الافتراضية 💳</h4>
                           <div class="badge bg-info text-black mt-2">VISA / MC</div>
                        </div>
                    </a>
                </div>

                <!-- Games & Gifts Card -->
                <div class="col-md-4">
                    <a href="/portal/store/games" class="text-decoration-none">
                        <div class="p-4 bg-dark bg-opacity-25 rounded border border-success border-opacity-25 hover-scale transition-fast h-100">
                           <i class="fa-solid fa-gamepad text-success h1 mb-4 shadow-sm"></i>
                           <h4 class="text-white cyber-font small">الألعاب والهدايا 🎮</h4>
                           <p class="x-small text-dim mt-3">Free Fire & PUBG Mobile.</p>
                           <div class="badge bg-success text-black mt-2">متوفر</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
