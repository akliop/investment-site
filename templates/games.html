{% extends "base.html" %}

{% block content %}
<div class="row g-4 text-center">
    <div class="col-lg-12">
        <div class="glass-card shadow-lg p-4 border-info border-opacity-25 mb-2">
            <h2 class="cyber-font text-white mb-2"><i class="fa-solid fa-gamepad text-info me-2"></i> مركز شحن الألعاب والكارطات</h2>
            <p class="text-dim">اشحن جواهرك وشداتك بـ أرخص الأسعار في الجزائر فوراً.</p>
        </div>
    </div>

    <!-- Free Fire -->
    <div class="col-md-4">
        <div class="glass-card shadow-lg p-3 h-100 border-danger border-opacity-25">
            <img src="https://img.icons8.com/color/96/free-fire.png" class="mb-3" width="60">
            <h5 class="text-white fw-bold">Free Fire Diamonds</h5>
            <div class="list-group list-group-flush bg-transparent mb-3 text-start">
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">110 Diamonds <span class="float-end text-success">220 DZD</span></button>
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">231 Diamonds <span class="float-end text-success">440 DZD</span></button>
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">583 Diamonds <span class="float-end text-success">1050 DZD</span></button>
            </div>
            <div class="input-group input-group-sm mb-3">
                <input type="text" class="form-control bg-black text-white border-danger border-opacity-25" placeholder="أدخل ID اللاعب">
            </div>
            <button class="btn btn-danger w-100 btn-sm fw-bold">طلب الشحن الآن</button>
        </div>
    </div>

    <!-- PUBG Mobile -->
    <div class="col-md-4">
        <div class="glass-card shadow-lg p-3 h-100 border-warning border-opacity-25">
            <img src="https://img.icons8.com/color/96/pubg.png" class="mb-3" width="60">
            <h5 class="text-white fw-bold">PUBG Mobile UC</h5>
            <div class="list-group list-group-flush bg-transparent mb-3 text-start">
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">60 UC <span class="float-end text-success">180 DZD</span></button>
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">325 UC <span class="float-end text-success">850 DZD</span></button>
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">660 UC <span class="float-end text-success">1650 DZD</span></button>
            </div>
            <div class="input-group input-group-sm mb-3">
                <input type="text" class="form-control bg-black text-white border-warning border-opacity-25" placeholder="أدخل ID اللاعب">
            </div>
            <button class="btn btn-warning w-100 btn-sm fw-bold text-black">طلب الشحن الآن</button>
        </div>
    </div>

    <!-- Google Play Cards -->
    <div class="col-md-4">
        <div class="glass-card shadow-lg p-3 h-100 border-primary border-opacity-25">
            <img src="https://img.icons8.com/color/96/google-play.png" class="mb-3" width="60">
            <h5 class="text-white fw-bold">Google Play Gift Cards</h5>
            <div class="list-group list-group-flush bg-transparent mb-3 text-start">
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">$5 Card <span class="float-end text-success">1100 DZD</span></button>
                <button class="list-group-item bg-transparent text-white border-secondary border-opacity-25 x-small">$10 Card <span class="float-end text-success">2150 DZD</span></button>
            </div>
            <button class="btn btn-primary w-100 btn-sm fw-bold">شراء البطاقة</button>
        </div>
    </div>
</div>

<style> .x-small { font-size: 0.8rem; } </style>
{% endblock %}
