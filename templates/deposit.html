{% extends "base.html" %}

{% block content %}
<div class="row pt-4 justify-content-center">
    <div class="col-lg-10 mb-5 text-center">
        <h1 class="cyber-font text-warning glow-pulse">نظام إيداع العقدة (Node Deposit)</h1>
        <p class="text-dim">استخدم العناوين التالية لزيادة رصيدك ودعم استمرارية العقدة.</p>
    </div>

    <!-- BTC Section -->
    <div class="col-md-4 mb-4">
        <div class="glass-card h-100 text-center border-warning border-opacity-25 hover-glow p-4">
            <div class="badge bg-warning text-black mb-3">شبكة BITCOIN</div>
            <div class="qr-box mb-3 bg-white p-2 rounded d-inline-block">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=1225jA1f8Heu35fnS83bsEMRt5BWYYJeL1" alt="BTC QR" style="width: 140px;">
            </div>
            <h5 class="text-white cyber-font small mb-3">عنوان BTC</h5>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control bg-dark border-dark text-warning x-small" id="btc-addr" value="1225jA1f8Heu35fnS83bsEMRt5BWYYJeL1" readonly>
                <button class="btn btn-warning" onclick="copy('btc-addr')"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </div>

    <!-- USDT TRC20 Section -->
    <div class="col-md-4 mb-4">
        <div class="glass-card h-100 text-center border-success border-opacity-25 hover-glow p-4">
            <div class="badge bg-success text-black mb-3">شبكة TRON (TRC20)</div>
            <div class="qr-box mb-3 bg-white p-2 rounded d-inline-block">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TRvoqf1GcB7UagrJj5prTURRDTDSwfY6oy" alt="TRC20 QR" style="width: 140px;">
            </div>
            <h5 class="text-white cyber-font small mb-3">عنوان USDT</h5>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control bg-dark border-dark text-success x-small" id="trc-addr" value="TRvoqf1GcB7UagrJj5prTURRDTDSwfY6oy" readonly>
                <button class="btn btn-success" onclick="copy('trc-addr')"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </div>

    <!-- EVM Section (BNB/USDT BEP20) -->
    <div class="col-md-4 mb-4">
        <div class="glass-card h-100 text-center border-primary border-opacity-25 hover-glow p-4">
            <div class="badge bg-primary text-black mb-3">شبكة BNB (BEP20)</div>
            <div class="qr-box mb-3 bg-white p-2 rounded d-inline-block">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=0x31cfee15eddf8169da734ec658c5b383a1e09973" alt="EVM QR" style="width: 140px;">
            </div>
            <h5 class="text-white cyber-font small mb-3">عنوان BNB/USDT</h5>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control bg-dark border-dark text-info x-small" id="evm-addr" value="0x31cfee15eddf8169da734ec658c5b383a1e09973" readonly>
                <button class="btn btn-primary" onclick="copy('evm-addr')"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    function copy(id) {
        var copyText = document.getElementById(id);
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("تم نسخ العنوان بنجاح! 💰");
    }
</script>

<style>
    .qr-box { transition: 0.3s; cursor: pointer; }
    .qr-box:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .hover-glow:hover { border-color: var(--accent-green) !important; box-shadow: 0 0 30px rgba(0, 230, 118, 0.1); }
    .x-small { font-size: 10px; }
</style>
{% endblock %}
