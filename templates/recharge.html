{% extends "base.html" %}

{% block content %}
<div class="row pt-4 justify-content-center">
    <div class="col-lg-10">
        <div class="glass-card border-success border-opacity-50 p-4 shadow-lg text-center overflow-hidden">
            <div class="d-flex justify-content-between align-items-center mb-5 mt-1 px-2">
               <a href="/portal/store" class="btn btn-outline-secondary btn-sm px-3 opacity-75 mt-1"><i class="fa-solid fa-arrow-right me-1"></i> للمتجر</a>
               <h3 class="cyber-font text-white mb-0 small"><i class="fa-solid fa-mobile-screen-button text-success me-2"></i> تعبئة الرصيد (الجزائر) 🇩🇿</h3>
               <div style="width: 80px;"></div>
            </div>
            
            <form action="/portal/x/store/recharge/process" method="POST" id="recharge-form">
                <!-- Operator Selection CORRECTED NAMES & CLEAR IMAGES -->
                <div class="row g-4 mb-5 justify-content-center">
                    <!-- Ooredoo -->
                    <div class="col-6 col-md-3">
                        <label class="operator-card p-2 rounded-3 transition-fast">
                            <input type="radio" name="operator" value="Ooredoo" class="d-none" required onclick="selectOp(this)">
                            <div class="img-container mb-2">
                                <img src="/.gemini/antigravity/brain/7b77c814-8d78-4656-a15d-971ac0be35e5/media__1775073930127.jpg" class="img-fluid rounded shadow-sm" alt="أوريدو">
                            </div>
                            <div class="fw-bold text-white small">أوريدو</div>
                        </label>
                    </div>

                    <!-- Mobilis -->
                    <div class="col-6 col-md-3">
                        <label class="operator-card p-2 rounded-3 transition-fast">
                            <input type="radio" name="operator" value="Mobilis" class="d-none" onclick="selectOp(this)">
                            <div class="img-container mb-2">
                                <img src="/.gemini/antigravity/brain/7b77c814-8d78-4656-a15d-971ac0be35e5/media__1775073930687.jpg" class="img-fluid rounded shadow-sm" alt="موبيليس">
                            </div>
                            <div class="fw-bold text-white small">موبيليس</div>
                        </label>
                    </div>

                    <!-- Djezzy -->
                    <div class="col-6 col-md-3">
                        <label class="operator-card p-2 rounded-3 transition-fast">
                            <input type="radio" name="operator" value="Djezzy" class="d-none" onclick="selectOp(this)">
                            <div class="img-container mb-2">
                                <img src="/.gemini/antigravity/brain/7b77c814-8d78-4656-a15d-971ac0be35e5/media__1775073948249.jpg" class="img-fluid rounded shadow-sm" alt="جيزي">
                            </div>
                            <div class="fw-bold text-white small">جيزي</div>
                        </label>
                    </div>
                </div>

                <!-- PHONE NUMBER & AMOUNT -->
                <div class="col-md-6 mx-auto mb-4 p-4 bg-black rounded border border-dark shadow-sm">
                    <div class="mb-4">
                        <label class="form-label text-dim small">رقم الهاتف (الجزائر)</label>
                        <input type="text" name="phone" class="form-control bg-dark border-dark text-info text-center h4 py-2 fw-bold" placeholder="0XXXXXXXXX" required>
                    </div>

                    <label class="form-label text-dim small mb-3">اختر كمية التعبئة</label>
                    <div class="row g-2 mb-4">
                        <div class="col-4">
                            <label class="amount-btn w-100 p-2 rounded border border-dark bg-dark bg-opacity-25 text-white">
                                <input type="radio" name="amount" value="100" class="d-none" required onclick="selectAm(this)">
                                <div class="fw-bold">100 دج</div>
                                <div class="x-small text-success">$1.00</div>
                            </label>
                        </div>
                        <div class="col-4">
                            <label class="amount-btn w-100 p-2 rounded border border-dark bg-dark bg-opacity-25 text-white">
                                <input type="radio" name="amount" value="200" class="d-none" onclick="selectAm(this)">
                                <div class="fw-bold">200 دج</div>
                                <div class="x-small text-success">$1.70</div>
                            </label>
                        </div>
                        <div class="col-4">
                            <label class="amount-btn w-100 p-2 rounded border border-dark bg-dark bg-opacity-25 text-white">
                                <input type="radio" name="amount" value="300" class="d-none" onclick="selectAm(this)">
                                <div class="fw-bold">300 دج</div>
                                <div class="x-small text-success">$2.45</div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 shadow-green-glow">إتمام التعبئة فوراً 💰</button>
                    <div class="x-small text-muted mt-3">سيتم خصم المبلغ من رصيدك USDT.</div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .operator-card { cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
    .img-container { background: #fff; padding: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; height: 100px; }
    .img-container img { max-height: 80px; object-fit: contain; }
    .operator-card:hover { transform: scale(1.05); }
    .active-op { border-color: var(--accent-green); background: rgba(0, 230, 118, 0.05); }
    .amount-btn { cursor: pointer; transition: 0.3s; }
    .active-am { background: var(--accent-green) !important; color: black !important; border-color: white !important; }
    .active-am .text-success { color: #000 !important; }
    .transition-fast { transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .shadow-green-glow { box-shadow: 0 0 20px var(--accent-green); }
</style>
{% endblock %}
